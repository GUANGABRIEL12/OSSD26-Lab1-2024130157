<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个计算器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            font-size: 18px;
        }

        button {
            padding: 12px;
            margin: 4px;
            width: 44%;
            border: none;
            border-radius: 6px;
            background: #238636;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #196c2e;
        }

        #result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>我的第一个计算器 - C4分支版本</h2>

        <input type="number" id="num1" placeholder="请输入第一个数字">
        <input type="number" id="num2" placeholder="请输入第二个数字">

        <div>
            <button onclick="calculate('+')">加法 +</button>
            <button onclick="calculate('-')">减法 -</button>
            <button onclick="calculate('*')">乘法 ×</button>
            <button onclick="calculate('/')">除法 ÷</button>
        </div>

        <button onclick="clearInputs()">清空</button>

        <p id="result">计算结果：等待输入</p>
    </div>

    <script>
        function calculate(operator) {
            const a = Number(document.getElementById("num1").value);
            const b = Number(document.getElementById("num2").value);
            let result;

            if (document.getElementById("num1").value === "" ||
                document.getElementById("num2").value === "") {
                alert("请输入两个数字！");
                return;
            }

            switch (operator) {
                case '+': result = a + b; break;
                case '-': result = a - b; break;
                case '*': result = a * b; break;
                case '/':
                    if (b === 0) {
                        alert("除数不能为零！");
                        return;
                    }
                    result = a / b;
                    break;
            }

            document.getElementById("result").textContent = "计算结果：" + result;
        }

        function clearInputs() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("result").textContent = "计算结果：等待输入";
        }
    </script>

</body>
</html>
